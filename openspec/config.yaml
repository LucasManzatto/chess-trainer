schema: spec-driven

context: |
  ## Project
  Chess trainer app: interactive chess board, puzzles, game analysis, move history.
  Two services: React frontend + FastAPI backend.

  ## Frontend (frontend/)
  - React 19, TypeScript, Vite
  - TanStack Router v1 (file-based routing)
  - TanStack Query v5 (server state)
  - Tailwind CSS v4 (@tailwindcss/vite plugin)
  - Zustand v5 (client state + localStorage persist)
  - Radix UI primitives
  - hey-api/openapi-ts + hey-api/client-fetch (typed API client generated from OpenAPI schema)
  - chess.js (game logic), react-chessboard (board UI)
  - Feature-sliced structure: src/features/<feature>/, src/components/ for shared UI
  - API base URL from VITE_API_URL env var (src/config/env.ts)

  ## Backend (backend/)
  - FastAPI, Python 3.11+ (Native type hint improvements)
  - OpenAPI schema auto-generated; frontend client regenerated via `npm run gen:api`
  - CORS controlled by ALLOWED_ORIGINS env var
  - SQLModel / SQLAlchemy 2.0 (Async execution using asyncpg driver)
  - Alembic (Database versioning and schema migrations)
  - Pydantic v2 (Strict request validation, data serialization, and Settings)
  - Redis + Arq (Async task background queues for heavy engine parsing)
  - Native WebSockets (Real-time chess board state synchronization)
  - Pytest-asyncio + Black/Ruff (Linting, formatting, and asynchronous endpoint testing)

  ## Conventions
  - Conventional commits
  - No default exports from feature modules — named exports only
  - Co-locate styles, hooks, and types within each feature folder
  - Server state (API data) → TanStack Query; UI/client state → Zustand
  - ESLint enforces react-hooks/rules-of-hooks and react-hooks/exhaustive-deps (plugin v7, flat config)
  - Never call setState inside a useEffect body to sync a prop — use the "adjust state during render" pattern (track prevProp in state, update in render body)
